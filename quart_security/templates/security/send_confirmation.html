{% from 'security/_macros.html' import render_input %}
<!doctype html>
<title>Resend confirmation</title>
<h1>Resend confirmation link</h1>
<form method="post" action="{{ url_for_security('send_confirmation') }}">
  {{ send_confirmation_form.hidden_tag() }}
  {{ render_input(send_confirmation_form.email, 'email') }}
  <button type="submit">Send link</button>
</form>
<p><a href="{{ url_for_security('login') }}">Back to sign in</a></p>
