{% from 'security/_macros.html' import render_input %}
<!doctype html>
<title>Choose a new password</title>
<h1>Choose a new password</h1>
<form method="post" action="{{ url_for_security('reset_password', token=reset_password_token) }}">
  {{ reset_password_form.hidden_tag() }}
  {{ render_input(reset_password_form.password, 'password') }}
  {{ render_input(reset_password_form.password_confirm, 'password') }}
  <button type="submit">Reset password</button>
</form>
